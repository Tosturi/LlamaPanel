; Copy this file to config.ini and edit it - config.ini is gitignored so your
; local paths (model directories, binary locations) never end up in the repo.
;
; Precedence for every setting: CLI flag > config.ini > environment variable > built-in default.

[panel]
; Where the LlamaPanel web UI itself listens.
host = 127.0.0.1
port = 8000

[llama]
; Directory to scan for .gguf model files.
models_dir = /path/to/gguf/models
; Path to the llama-server binary (or just its name if it's on PATH).
server_bin = llama-server

[advanced]
; Where presets.json and llama-server.log are stored.
; If left unset, a per-user directory outside the install folder is used so
; presets survive upgrades:
;   Windows  %LOCALAPPDATA%\LlamaPanel
;   macOS    ~/Library/Application Support/LlamaPanel
;   Linux    $XDG_DATA_HOME/llamapanel  (~/.local/share/llamapanel)
; run.py prints the effective path at startup. Presets found in data/ next
; to run.py (the pre-0.2 location) are copied over on first start.
; data_dir = /path/to/data
