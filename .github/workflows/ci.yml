name: CI

# Runs on every PR and every push to main. Only verifies - nothing here
# commits or publishes. Releases are cut separately by release.yml when a
# v* tag is pushed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest -v

  updater-platforms:
    name: Updater (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Check updater and rollback
        working-directory: backend
        run: pytest -v tests/test_updates.py

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` runs `tsc -b` first, so this is the typecheck too.
      # The output is discarded - dist/ is not tracked in git.
      - name: Build
        working-directory: frontend
        run: npm run build

  api-types:
    name: Generated API types up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      # frontend/src/api-types.ts is generated from the backend's OpenAPI
      # schema and committed. If a pydantic model or route changed without
      # `npm run gen:api`, the regenerated file differs and this job fails.
      - name: Regenerate and compare
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code -- src/api-types.ts || {
            echo "::error::frontend/src/api-types.ts is stale. Run 'npm run gen:api' in frontend/ and commit the result."
            exit 1
          }
