name: Build frontend

# Rebuilds frontend/dist and commits it back to the repo, so `git clone` +
# `python run.py` keeps working on a machine with no Node.js - nobody has to
# remember to run `npm run build` before deploying.
on:
  push:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "frontend/index.html"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/tsconfig*.json"
      - "frontend/vite.config.ts"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Commit rebuilt dist (if changed)
        run: |
          if git status --porcelain frontend/dist | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add frontend/dist
            git commit -m "chore: rebuild frontend dist [skip ci]"
            git push
          else
            echo "frontend/dist is already up to date, nothing to commit."
          fi
